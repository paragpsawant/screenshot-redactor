name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  web:
    name: Web app (rules + models + vendored libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vendor runtime libraries (web/vendor is a build output)
        run: npm run vendor
      - name: Unit + end-to-end pipeline tests (real models, onnxruntime-node)
        run: npm test

  browser:
    name: Real-browser E2E (no uploads, no third-party requests)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run vendor
      - run: npx playwright-core install --with-deps chromium
      - name: Serve the app and run the browser test
        env:
          E2E_BROWSER: chromium
          PORT: "8090"
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/ >/dev/null && break; sleep 1; done
          node tests/e2e.browser.mjs http://127.0.0.1:8090/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/.cache/e2e/
          if-no-files-found: ignore

  python:
    name: Python app (rules + OCR pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (the optional GLiNER/torch model is not needed for tests)
        run: pip install rapidocr==3.9.2 onnxruntime==1.30.0 opencv-python-headless==5.0.0.93 "pillow>=11" "numpy>=2" pytest
      - run: pytest -q
