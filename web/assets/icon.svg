<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Screenshot Redactor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- viewfinder corners (screenshot capture) -->
  <g fill="none" stroke="url(#scan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 150V110a32 32 0 0 1 32-32h40"/>
    <path d="M362 78h40a32 32 0 0 1 32 32v40"/>
    <path d="M434 362v40a32 32 0 0 1-32 32h-40"/>
    <path d="M150 434h-40a32 32 0 0 1-32-32v-40"/>
  </g>
  <!-- screenshot card -->
  <rect x="124" y="136" width="264" height="240" rx="26" fill="#f8fafc"/>
  <!-- window dots -->
  <circle cx="156" cy="166" r="9" fill="#cbd5e1"/>
  <circle cx="184" cy="166" r="9" fill="#cbd5e1"/>
  <circle cx="212" cy="166" r="9" fill="#cbd5e1"/>
  <!-- visible text lines -->
  <rect x="152" y="204" width="150" height="22" rx="11" fill="#94a3b8"/>
  <rect x="152" y="320" width="118" height="22" rx="11" fill="#94a3b8"/>
  <!-- the redaction: solid bar with a detection highlight -->
  <rect x="140" y="246" width="232" height="56" rx="14" fill="url(#scan)"/>
  <rect x="148" y="254" width="216" height="40" rx="9" fill="#0b1020"/>
</svg>
