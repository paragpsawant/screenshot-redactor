[project]
name = "screenshot-redactor"
version = "0.1.0"
description = "Automatically find and hide secrets, PII, faces and QR codes in screenshots."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
